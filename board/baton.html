<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baton Health — Visit Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#16181d; --muted:#6b6f78; --line:#e5e1d8;
  --teal:#0f766e; --teal-soft:#e0f2ef;
  --review:#b45309; --review-soft:#fef3c7;
  --urgent:#c2410c; --urgent-soft:#ffedd5;
  --emergency:#b91c1c; --emergency-soft:#fee2e2;
  --ok:#15803d; --ok-soft:#dcfce7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:20px 24px 28px;min-height:100vh}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
h1 span{font-weight:500;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#c4c0b6}
.pill.live{color:var(--ink)} .pill.live .dot{background:#dc2626;animation:p 1.2s infinite}
.pill.hold .dot{background:var(--review)}
@keyframes p{50%{opacity:.25}}
#timer{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card+.card{margin-top:16px}
h2{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.visit{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.visit:last-child{border:0}
.visit b{font-weight:600;display:block} .visit small{color:var(--muted);font-size:12px}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap}
.c-filed,.c-given,.c-routine{background:var(--ok-soft);color:var(--ok)}
.c-review,.c-refused,.c-missed,.c-unsure{background:var(--review-soft);color:var(--review)}
.c-urgent{background:var(--urgent-soft);color:var(--urgent)}
.c-emergency{background:var(--emergency-soft);color:var(--emergency)}
.c-in_progress,.c-not_due{background:#eef0f3;color:var(--muted)}
.c-incomplete{background:#ede9fe;color:#6d28d9}
.who{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.who .name{font-size:22px;font-weight:700;letter-spacing:-.02em}
.who-sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.who-sub b{color:var(--teal);font-weight:600}
.empty{color:var(--muted);font-size:15px;padding:28px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border:0}
td.label{width:34%;font-weight:600}
td.q{color:var(--muted);font-size:13px;font-style:italic;padding-left:10px}
.was{color:var(--muted);text-decoration:line-through;font-size:12px;margin-left:6px}
.flash{animation:f 1.1s}
@keyframes f{0%{background:var(--teal-soft)}100%{background:transparent}}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px}
.missing{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.missing span{font-size:12px;border:1px dashed #c9c4b8;color:var(--muted);padding:3px 8px;border-radius:7px}
.status{margin-top:14px;padding:14px 16px;border-radius:12px;display:none;font-weight:600}
.status.show{display:block}
.alert{border-left:4px solid;padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px;animation:in .3s}
.alert b{display:block;font-weight:600;margin-bottom:2px}
.alert i{color:var(--muted);font-size:12.5px}
.a-review{border-color:var(--review);background:var(--review-soft)}
.a-urgent{border-color:var(--urgent);background:var(--urgent-soft)}
.a-emergency{border-color:var(--emergency);background:var(--emergency-soft)}
.a-pattern{border-color:#7c3aed;background:#f3efff}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
#chat{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;animation:in .25s}
.assistant{background:#eef0f3;align-self:flex-start;border-bottom-left-radius:3px}
.user{background:var(--teal-soft);align-self:flex-end;border-bottom-right-radius:3px}
.sys{align-self:center;font-size:12px;color:var(--muted)}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 18 L20 6"/><circle cx="20" cy="6" r="1.5" fill="#fff"/></svg></div>
  <h1>Baton Health <span>· Visit Handoff Line</span></h1>
  <div class="pill" id="pill"><span class="dot"></span><span id="pillText">Waiting for a call</span></div>
  <div id="timer">00:00</div>
</header>

<div class="grid">
  <aside>
    <div class="card"><h2>Recent visits <span id="count"></span></h2><div id="visits"><div class="empty">Loading…</div></div></div>
  </aside>

  <main>
    <div class="card" id="note">
      <h2>Live handoff <span id="level"></span></h2>
      <div id="noteBody"><div class="empty">Call the line. The report fills in here as the caregiver talks.</div></div>
    </div>
  </main>

  <aside>
    <div class="card"><h2>Alerts</h2><div id="alerts"><div class="empty" style="padding:10px 0">No alerts yet</div></div></div>
    <div class="card"><h2>Transcript</h2><div id="chat"></div></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {filed:"Filed", in_progress:"In progress", incomplete:"Incomplete", review:"Nurse review", urgent:"Urgent", emergency:"Emergency", routine:"Routine",
               given:"Given", refused:"Refused", missed:"Missed", not_due:"Not due", unsure:"Unsure"};
const SECTIONS = [["food","Food & drink"],["mobility","Mobility"],["mood","Mood"],["skin","Skin & toileting"],["other","Anything new"]];
let start = null, tick = null, seenAlerts = new Set(), prev = {};

function chip(k){ return `<span class="chip c-${k}">${LABEL[k] || esc(k)}</span>`; }
function pill(text, cls){ $("#pillText").textContent = text; $("#pill").className = "pill " + (cls||""); }
function timer(on){
  clearInterval(tick);
  if(!on) return;
  start = Date.now();
  tick = setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);$("#timer").textContent=`${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`},500);
}

async function loadVisits(){
  try{
    const vs = await (await fetch("/api/visits")).json();
    $("#count").textContent = vs.length;
    $("#visits").innerHTML = vs.map(v => {
      const when = new Date(v.started*1000).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
      const state = v.status === "filed" ? (v.level === "routine" ? "filed" : v.level) : v.status;
      return `<div class="visit"><div><b>${esc(v.client_name)}</b><small>${esc(v.caregiver_name)} · ${when}</small></div>${chip(state)}</div>`;
    }).join("") || `<div class="empty">No visits yet</div>`;
  }catch(e){}
}

function renderNote(v, patterns){
  $("#level").innerHTML = chip(v.status === "filed" ? (v.level==="routine"?"filed":v.level) : v.level);
  const medRows = Object.entries(v.med_names).map(([id,name]) => {
    const m = v.meds[id];
    const key = "m:"+id, val = m ? m.value : "";
    const flash = m && prev[key] !== val ? "flash" : ""; prev[key] = val;
    const was = m && m.history.length ? `<span class="was">${LABEL[m.history.at(-1).value]||m.history.at(-1).value}</span>` : "";
    return `<tr class="${flash}"><td class="label">${esc(name)}</td><td>${m ? chip(m.value)+was : '<span class="chip c-in_progress">—</span>'}</td><td class="q">${m ? "“"+esc(m.quote)+"”" : ""}</td></tr>`;
  }).join("");
  const secRows = SECTIONS.map(([k,label]) => {
    const s = v.sections[k];
    const val = s ? (k==="mobility" ? ({steady:"Steady",near_fall:"Near fall",fall:"Fall"}[s.value]||s.value) + (s.detail && s.value!=="steady" ? " — "+s.detail : "") : s.value) : "";
    const key = "s:"+k, flash = s && prev[key] !== val ? "flash" : ""; prev[key] = val;
    const warn = s && (s.concern || ["fall","near_fall"].includes(s.value)) ? " ⚠" : "";
    const was = s && s.history.length ? `<span class="was">${esc(s.history.at(-1).value)}</span>` : "";
    return `<tr class="${flash}"><td class="label">${label}</td><td>${s ? esc(val)+warn+was : '<span style="color:#b4afa4">—</span>'}</td><td class="q">${s ? "“"+esc(s.quote)+"”" : ""}</td></tr>`;
  }).join("");
  const missing = v.missing.length ? `<div class="missing">${v.missing.map(m => `<span>${m.startsWith("med:") ? v.med_names[m.slice(4)] : m}</span>`).join("")}</div>` : "";
  const st = v.status === "filed"
    ? `<div class="status show" style="background:var(--ok-soft);color:var(--ok)">✓ Filed and verified · every field backed by the caregiver's own words</div>`
    : v.status === "incomplete" ? `<div class="status show" style="background:#ede9fe;color:#6d28d9">Call ended early · saved as incomplete, resumes on callback</div>` : "";
  $("#noteBody").innerHTML = `
    <div class="who"><span class="name">${esc(v.client_name)}</span></div>
    <div class="who-sub">Reported by <b>${esc(v.caregiver_name)}</b> · verified by ${esc(v.identified_by)}</div>
    <div class="sec-title">Medications</div><table>${medRows}</table>
    <div class="sec-title">Observations</div><table>${secRows}</table>
    ${missing}${st}`;
  const TITLE = {pattern:"Pattern across visits", integrity:"Record integrity · supervisor notified", unlisted_med:"Unlisted medication",
                 safeguarding:"Safeguarding · supervisor alerted", advice_request:"Advice request · nurse follow-up", emergency:"EMERGENCY · 911 advised"};
  [...v.flags, ...(patterns||[])].forEach(f => addAlert(f.kind === "pattern" ? "pattern" : f.level, f.text, f.quote, TITLE[f.kind] || null));
}

function addAlert(level, text, quote, title){
  const id = level + text; if(seenAlerts.has(id)) return; seenAlerts.add(id);
  if($("#alerts .empty")) $("#alerts").innerHTML = "";
  const head = title || {review:"Nurse review", urgent:"Urgent · supervisor alerted", emergency:"EMERGENCY · 911 advised"}[level] || "Alert";
  const d = document.createElement("div");
  d.className = "alert a-" + level;
  d.innerHTML = `<b>${head}</b>${esc(text)}${quote ? `<br><i>“${esc(quote)}”</i>` : ""}`;
  $("#alerts").prepend(d);
}
function msg(role, text){
  const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text;
  $("#chat").appendChild(d); $("#chat").scrollTop = 1e9;
}

const on = {
  call_started(){ seenAlerts.clear(); prev = {}; $("#alerts").innerHTML='<div class="empty" style="padding:10px 0">No alerts yet</div>';
    $("#chat").innerHTML=""; $("#noteBody").innerHTML='<div class="empty">Verifying caller…</div>'; $("#level").innerHTML=""; pill("Live call","live"); timer(true); },
  identified(e){ msg("sys", `Verified ${e.caregiver} by ${e.how}`); },
  identity_failed(e){ msg("sys", `PIN not recognised (${e.attempts}/3)`); },
  transcript(e){ msg(e.role === "user" ? "user" : "assistant", e.text); if(!$("#pill").classList.contains("hold")) pill("Live call","live"); },
  note(e){ renderNote(e.visit, e.patterns); loadVisits(); },
  filed(e){ renderNote(e.visit, e.patterns); loadVisits(); pill("Report filed"); },
  alert(e){ addAlert(e.level, e.text, e.quote); },
  hold(){ pill("On hold · waiting","live hold"); msg("sys","Caregiver put the line on hold"); },
  call_ended(){ timer(false); loadVisits(); if($("#pillText").textContent !== "Report filed") pill("Call ended"); },
};
new EventSource("/stream").onmessage = m => { const e = JSON.parse(m.data); on[e.type]?.(e); };
loadVisits();
</script>
</body>
</html>
